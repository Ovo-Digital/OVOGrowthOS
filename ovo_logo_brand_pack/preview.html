<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OVO Logo Pack Preview</title>
  <style>
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #111; color: #fff; padding: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .card { border: 1px solid #333; border-radius: 18px; padding: 18px; background: #181818; }
    .card.white { background: #f5f5f5; color: #111; }
    img { width: 100%; display: block; border-radius: 12px; }
    code { font-size: 13px; opacity: .85; }
  </style>
</head>
<body>
  <h1>OVO Logo Pack</h1>
  <div class="grid">
    <div class="card"><img src="logo-neon-on-black.svg"><p><code>logo-neon-on-black.svg</code></p></div>
    <div class="card"><img src="logo-white-on-black.svg"><p><code>logo-white-on-black.svg</code></p></div>
    <div class="card white"><img src="logo-black-on-white.svg"><p><code>logo-black-on-white.svg</code></p></div>
    <div class="card"><img src="logo-gradient-on-black.svg"><p><code>logo-gradient-on-black.svg</code></p></div>
    <div class="card"><img src="logo-animated-neon.svg"><p><code>logo-animated-neon.svg</code></p></div>
    <div class="card"><img src="favicon.svg"><p><code>favicon.svg</code></p></div>
  </div>
</body>
</html>
