services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ovo_growth_os
      POSTGRES_USER: ovo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ovo_dev_password}
    volumes:
      - ovo_postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovo -d ovo_growth_os"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./apps/api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=ovo_growth_os;Username=ovo;Password=${POSTGRES_PASSWORD:-ovo_dev_password}
      Jwt__Key: ${JWT_KEY:-local-development-key-change-before-production-32chars}
      WebOrigin: http://localhost:3000
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8080" }
    ports: ["3000:3000"]
    depends_on:
      - backend
volumes:
  ovo_postgres_data:
